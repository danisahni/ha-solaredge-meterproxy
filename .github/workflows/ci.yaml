name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test-ha.txt
      - run: pytest -v tests/integration

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  build:
    runs-on: ubuntu-latest
    needs: [test, integration]
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Base image from build.yaml
        id: base
        run: echo "from=$(yq '.build_from.${{ matrix.arch }}' solaredge_meterproxy/build.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: solaredge_meterproxy
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          build-args: BUILD_FROM=${{ steps.base.outputs.from }}
          push: false
